services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TOURNAMENT_DATA_FILE: /app/data/tournament.json
      REGISTRATIONS_DATA_FILE: /app/data/registrations.json
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    expose:
      - "8000"
    volumes:
      - tournament-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  tournament-data:
