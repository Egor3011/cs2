services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TOURNAMENT_DATA_FILE: /app/data/tournament.json
      REGISTRATIONS_DATA_FILE: /app/data/registrations.json
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    expose:
      - "8000"
    volumes:
      - tournament-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; opener = urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  tournament-data:
